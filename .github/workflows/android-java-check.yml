name: Android Java check

# Needs no game files. Confirms the Java side still compiles with minSdk 31 and
# that no API newer than Android 12 is called without a version guard.

on:
  pull_request:
    paths:
      - "android/**"
      - "CMakePresets.json"
      - "tests/**"
      - ".github/workflows/android-java-check.yml"
  push:
    branches: [redmi9-android12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Update policy tests
        run: python3 tests/rp6/check-updates.py

      - name: Compile and lint (minSdk 31)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Fail on API-level problems
        run: |
          report=android/app/build/reports/lint-results-debug.xml
          test -f "$report"
          if grep -q 'id="NewApi"' "$report"; then
            echo "::error::Lint found calls newer than minSdk 31"
            grep -B1 -A6 'id="NewApi"' "$report" | head -60
            exit 1
          fi

      - name: Verify minSdk in the built APK
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          "$aapt" dump badging "$apk" | grep -E "^sdkVersion:'31'"
